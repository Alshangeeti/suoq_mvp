<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Circular avatar background: warm desert sand -->
  <defs>
    <clipPath id="circleClip">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>
  </defs>
  <g clip-path="url(#circleClip)">
    <circle cx="100" cy="100" r="100" fill="#F2E3C6"/>
    <!-- subtle dune -->
    <path d="M-10 168 Q 60 148 110 166 T 210 160 L 210 210 L -10 210 Z" fill="#E8D2A8"/>

    <!-- Daraa: wide flowing sky-blue robe with signature broad shoulders -->
    <path d="M100 78
             C 70 78 48 96 34 132
             L 22 172 Q 60 190 100 190 Q 140 190 178 172
             L 166 132
             C 152 96 130 78 100 78 Z"
          fill="#5BA8D9"/>
    <!-- wide winged sleeves (folded up on shoulders, typical daraa silhouette) -->
    <path d="M60 86 C 40 92 28 108 20 130 L 40 140 C 46 116 54 100 66 90 Z" fill="#4C93C4"/>
    <path d="M140 86 C 160 92 172 108 180 130 L 160 140 C 154 116 146 100 134 90 Z" fill="#4C93C4"/>

    <!-- Chest pocket panel with gold embroidery (tilmidi) -->
    <rect x="82" y="96" width="36" height="44" rx="4" fill="#4C93C4"/>
    <rect x="82" y="96" width="36" height="44" rx="4" fill="none" stroke="#E9B94E" stroke-width="3"/>
    <path d="M88 104 H112 M88 112 H112 M88 120 H106" stroke="#E9B94E" stroke-width="2.5" stroke-linecap="round"/>
    <!-- gold neckline embroidery -->
    <path d="M86 82 Q 100 94 114 82" fill="none" stroke="#E9B94E" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="91" y="66" width="18" height="14" rx="6" fill="#8A5A3B"/>

    <!-- Face -->
    <circle cx="100" cy="52" r="24" fill="#9C6B47"/>
    <!-- Hawli (white turban) wrapped around head -->
    <path d="M76 46 C 76 30 87 22 100 22 C 113 22 124 30 124 46
             C 124 50 122 52 118 51 C 112 42 106 38 100 38 C 94 38 88 42 82 51 C 78 52 76 50 76 46 Z"
          fill="#F7F4EC"/>
    <!-- turban side drape -->
    <path d="M122 44 C 128 52 128 64 122 74 C 118 70 117 58 118 50 Z" fill="#F7F4EC"/>
    <path d="M79 36 Q 100 28 121 36" fill="none" stroke="#E2DCCB" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Eyes + brows -->
    <circle cx="92" cy="52" r="2.6" fill="#2E1D12"/>
    <circle cx="108" cy="52" r="2.6" fill="#2E1D12"/>
    <path d="M87 46 Q 92 43.5 97 46 M103 46 Q 108 43.5 113 46" stroke="#2E1D12" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Smile -->
    <path d="M92 62 Q 100 68 108 62" stroke="#2E1D12" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
