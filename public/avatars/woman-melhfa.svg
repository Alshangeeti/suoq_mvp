<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Circular avatar background: warm desert sand (matches the daraa icon) -->
  <defs>
    <clipPath id="circleClip2">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>
  </defs>
  <g clip-path="url(#circleClip2)">
    <circle cx="100" cy="100" r="100" fill="#F2E3C6"/>
    <!-- subtle dune -->
    <path d="M-10 168 Q 60 148 110 166 T 210 160 L 210 210 L -10 210 Z" fill="#E8D2A8"/>

    <!-- Melhfa: one flowing wrap covering head and body -->
    <!-- body drape -->
    <path d="M100 30
             C 74 30 62 46 60 66
             C 58 84 52 100 40 130
             L 28 172 Q 62 190 100 190 Q 138 190 172 172
             L 160 130
             C 148 100 142 84 140 66
             C 138 46 126 30 100 30 Z"
          fill="#C94F7C"/>
    <!-- shading fold on one side -->
    <path d="M100 30 C 126 30 138 46 140 66 C 142 84 148 100 160 130 L 172 172 Q 150 183 126 187
             C 132 150 134 110 126 78 C 121 56 112 40 100 30 Z"
          fill="#B03D68"/>
    <!-- tie-dye pattern dots (typical melhfa print) -->
    <g fill="#F3CE5C" opacity="0.9">
      <circle cx="66" cy="120" r="4"/>
      <circle cx="82" cy="150" r="4"/>
      <circle cx="55" cy="155" r="3.2"/>
      <circle cx="120" cy="145" r="4"/>
      <circle cx="142" cy="160" r="3.2"/>
      <circle cx="135" cy="115" r="3.5"/>
    </g>
    <g fill="none" stroke="#F3CE5C" stroke-width="2" opacity="0.85">
      <circle cx="66" cy="120" r="8.5"/>
      <circle cx="120" cy="145" r="8.5"/>
      <circle cx="142" cy="160" r="6.5"/>
    </g>

    <!-- head drape (hood part of the melhfa) -->
    <path d="M100 24
             C 78 24 68 40 68 56
             C 68 70 74 80 82 84
             C 78 66 82 50 100 44
             C 118 50 122 66 118 84
             C 126 80 132 70 132 56
             C 132 40 122 24 100 24 Z"
          fill="#B03D68"/>

    <!-- Face opening -->
    <circle cx="100" cy="60" r="21" fill="#A9754F"/>
    <!-- melhfa edge framing the face -->
    <path d="M82 52 C 84 38 92 32 100 32 C 108 32 116 38 118 52
             C 119 60 118 68 114 75 C 116 60 110 46 100 44 C 90 46 84 60 86 75 C 82 68 81 60 82 52 Z"
          fill="#C94F7C"/>
    <!-- gold edge trim on the wrap around face -->
    <path d="M86 74 C 84 58 90 46 100 44 C 110 46 116 58 114 74"
          fill="none" stroke="#F3CE5C" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Eyes with lashes + brows -->
    <circle cx="93" cy="60" r="2.6" fill="#2E1D12"/>
    <circle cx="107" cy="60" r="2.6" fill="#2E1D12"/>
    <path d="M88.5 55 Q 93 52.5 97.5 55 M102.5 55 Q 107 52.5 111.5 55" stroke="#2E1D12" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M89.5 58 L 87 56.5 M110.5 58 L 113 56.5" stroke="#2E1D12" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Smile -->
    <path d="M93 69 Q 100 74.5 107 69" stroke="#2E1D12" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
